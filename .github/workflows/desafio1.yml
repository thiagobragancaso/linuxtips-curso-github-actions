name: Workflow do Desafio 1 da Linuxtips

on:
  workflow_dispatch:
    inputs:
      image:
        required: true
        type: string
        description: Docker image to be pulled (required)
      tag:
        type: string
        description: Docker image tag to be pulled (optional). If not informed the tag lateste will be used.
        default: 'latest'

jobs:
  desafio1:
    runs-on: ubuntu-latest
    steps:
      - name: Docker pull image
        run: docker pull ${{ inputs.image }}:${{ inputs.tag }}

      - name: List the docker images
        run: docker image ls

      - name: Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ inputs.image }}:${{ inputs.tag }}
          dockerhub-user: ${{ secrets.DOCKER_USER }}
          dockerhub-password: ${{ secrets.DOCKER_PAT }}