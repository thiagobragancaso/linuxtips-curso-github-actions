name: Workflow do Desafio 1 da Linuxtips

on:
  workflow_dispatch:
    inputs:
      docker-image:
        required: true
        type: string
        description: Docker image to be pulled
      docker-image-tag:
        required: true
        type: string
        description: Docker image tag to be pulled. If not informed the tag lateste will be used.

jobs:
  desafio1:
    runs-on: ubuntu-latest
    steps:
      - name: Docker pull image
        run: docker pull ${{ github.event.inputs.docker-image }}

      - name: List the docker images
        run: docker image ls

      - name: Show the tag informed
        run: echo "${{ github.event.inputs.docker-image-tag }}"



